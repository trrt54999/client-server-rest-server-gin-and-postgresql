basePath: /api/v1
definitions:
  dto.CreateIncidentDto:
    properties:
      description:
        type: string
      priority:
        enum:
        - low
        - medium
        - high
        - critical
        type: string
      title:
        maxLength: 100
        minLength: 3
        type: string
    required:
    - description
    - priority
    - title
    type: object
  dto.ErrorResponse:
    properties:
      error:
        example: Incident not found!
        type: string
    type: object
  dto.LoginUserDto:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.RegisterUserDto:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.TokenResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  dto.UpdateIncidentStatusDto:
    properties:
      status:
        enum:
        - open
        - in_progress
        - resolved
        - closed
        type: string
    required:
    - status
    type: object
  model.Incident:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      priority:
        type: string
      status:
        type: string
      title:
        type: string
      user_id:
        type: integer
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API
  title: Incident Tracker API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Check email, pass and return subcsribe jwt-token (24h termin)
      parameters:
      - description: Account credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.LoginUserDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: User Auth
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create user. Password in hash
      parameters:
      - description: Password min 6 symbols
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterUserDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Registration user
      tags:
      - auth
  /incidents:
    get:
      description: Return all incidents
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Incident'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Incidents list
      tags:
      - incidents
    post:
      consumes:
      - application/json
      description: Create incident from auth user with token
      parameters:
      - description: Incident data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreateIncidentDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Incident'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create incident
      tags:
      - incidents
  /incidents/{id}:
    delete:
      description: Remove incident from ID (needs JWT)
      parameters:
      - description: ID incident
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove incident
      tags:
      - incidents
    get:
      description: return 1 incident
      parameters:
      - description: ID incident
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Incident'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Inciden from id
      tags:
      - incidents
  /incidents/{id}/status:
    patch:
      consumes:
      - application/json
      description: Update incident status (need token)
      parameters:
      - description: ID incident
        in: path
        name: id
        required: true
        type: integer
      - description: New status
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateIncidentStatusDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Incident'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change incident status
      tags:
      - incidents
securityDefinitions:
  BearerAuth:
    description: 'Token in format: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
